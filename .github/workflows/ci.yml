name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "Task_Masood/**"
  pull_request:
    paths:
      - "Task_Masood/**"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Task_Masood

    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://localhost:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Task_Masood/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: Task_Masood
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t attendance-api:ci .
